##############################################################
# Render.com deployment blueprint
# Free tier: 1 web service + 1 PostgreSQL (free 90 days)
# All three apps (prime-site + admin-panel + api-server) run
# from a single Express server — no CORS headaches.
##############################################################

services:
  - type: web
    name: prime-packaging-boxes
    env: node
    region: oregon
    plan: free
    buildCommand: >
      pnpm install --frozen-lockfile &&
      PORT=3000 BASE_PATH=/ pnpm --filter @workspace/prime-site run build &&
      PORT=3000 BASE_PATH=/admin/ pnpm --filter @workspace/admin-panel run build &&
      pnpm --filter @workspace/api-server run build
    startCommand: >
      pnpm --filter @workspace/db run push &&
      pnpm --filter @workspace/api-server run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: prime-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: PORT
        value: 10000

databases:
  - name: prime-db
    databaseName: prime_packaging
    plan: free
    region: oregon
