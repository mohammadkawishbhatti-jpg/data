kind = "mobile"
previewPath = "/customer-portal/"
title = "Prime Portal"
version = "1.0.0"
id = "artifacts/customer-portal"

[[services]]
name = "web"
paths = [ "/customer-portal/", "/customer-portal" ]
localPort = 20045

[services.development]
run = "pnpm --filter @workspace/customer-portal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/customer-portal", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/customer-portal", "run", "serve" ]

[services.env]
PORT = "20045"
BASE_PATH = "/customer-portal/"
