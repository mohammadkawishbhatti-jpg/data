<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Prime Packaging Boxes</title>
    <meta name="description" content="Prime Packaging Boxes — built on Replit. Update this description to reflect the app." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Prime Packaging Boxes" />
    <meta property="og:description" content="Prime Packaging Boxes — built on Replit. Update this description to reflect the app." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Prime Packaging Boxes" />
    <meta name="twitter:description" content="Prime Packaging Boxes — built on Replit. Update this description to reflect the app." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1a2f5a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Prime Packaging" />
    <!-- DNS prefetch for API uploads CDN — resolves before first image request -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://images.unsplash.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <!-- DM Serif Display — premium display font for hero headings -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <!-- hreflang — US + UK targeting for Google -->
    <link rel="alternate" hreflang="en-us"    href="https://www.primepackagingboxes.com/" />
    <link rel="alternate" hreflang="en-gb"    href="https://www.primepackagingboxes.com/" />
    <link rel="alternate" hreflang="en"       href="https://www.primepackagingboxes.com/" />
    <link rel="alternate" hreflang="x-default" href="https://www.primepackagingboxes.com/" />
    <!-- Font: early DNS + TLS handshake before stylesheet fetch -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- display=swap: text renders immediately in system font, Inter swaps in when ready -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
