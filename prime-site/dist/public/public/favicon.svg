<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="180" height="180" rx="36" fill="#1a2f5a"/>
  <rect width="180" height="180" rx="36" fill="url(#grad)"/>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a2f5a"/>
      <stop offset="100%" stop-color="#243d6e"/>
    </linearGradient>
  </defs>
  <!-- Red accent bar top-left -->
  <rect x="18" y="18" width="8" height="52" rx="4" fill="#e63329"/>
  <!-- Letter P -->
  <text x="34" y="118" font-family="Georgia, serif" font-size="110" font-weight="700" fill="white" letter-spacing="-4">P</text>
  <!-- Dot accent bottom-right -->
  <circle cx="148" cy="148" r="10" fill="#e63329"/>
</svg>
